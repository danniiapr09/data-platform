# Aturan cleaning default. Ubah di sini, tidak perlu ubah kode.
missing_values:
  strategy: flag        # flag | drop | fill_mean | fill_median | fill_zero
duplicates:
  action: drop          # drop | flag
outliers:
  method: iqr           # iqr | zscore
  threshold: 1.5        # iqr: pengali IQR, zscore: batas z
  action: flag          # JANGAN langsung hapus; tandai untuk direview
  min_rows: 4           # minimal baris terisi agar deteksi dijalankan
  exclude_columns: []   # kolom yang dilewati, mis. [tahun, kode_wilayah]
formats:
  strip_whitespace: true
  lowercase_columns: true
